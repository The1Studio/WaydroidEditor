name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, arc, the1studio, org]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # 10.0.x is the SDK (`.slnx` needs >= 9.0.200); 8.0.x supplies the runtime
          # the net8.0 test host runs on.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test
        run: dotnet test WaydroidEditor.slnx -c Release

      - name: Publish single-file linux-x64 binary
        run: dotnet publish src/WaydroidEditor -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Pack release archive
        # tar carries the mode, which release assets do not: extracting yields a runnable binary.
        run: |
          chmod 755 publish/WaydroidEditor
          tar -C publish --owner=0 --group=0 -czf WaydroidEditor.tgz WaydroidEditor
          tar tzvf WaydroidEditor.tgz

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.${GITHUB_RUN_NUMBER}"
          notes=$(cat <<'EOF'
          Self-contained linux-x64 binary; no .NET runtime needed.

          ```bash
          curl -fLO https://github.com/The1Studio/WaydroidEditor/releases/latest/download/WaydroidEditor.tgz
          tar xzf WaydroidEditor.tgz
          ./WaydroidEditor
          ```
          EOF
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" WaydroidEditor.tgz --clobber
          else
            gh release create "$tag" --title "$tag" --generate-notes --notes "$notes" WaydroidEditor.tgz
          fi
