name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # 10.0.x is the SDK (`.slnx` needs >= 9.0.200); 8.0.x supplies the runtime
          # the net8.0 test host runs on.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test
        run: dotnet test WaydroidEditor.slnx -c Release

      - name: Publish single-file linux-x64 binary
        run: dotnet publish src/WaydroidEditor -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.${GITHUB_RUN_NUMBER}"
          # GitHub does not store a Unix mode on release assets, so the notes carry the step
          # that makes the download runnable.
          notes=$(cat <<'EOF'
          Self-contained linux-x64 binary; no .NET runtime needed.

          ```bash
          curl -fLo WaydroidEditor \
              https://github.com/The1Studio/WaydroidEditor/releases/latest/download/WaydroidEditor
          chmod +x WaydroidEditor && ./WaydroidEditor
          ```
          EOF
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" publish/WaydroidEditor --clobber
          else
            gh release create "$tag" --title "$tag" --generate-notes --notes "$notes" publish/WaydroidEditor
          fi
